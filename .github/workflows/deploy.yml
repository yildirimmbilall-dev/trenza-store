name: Deploy TRENZA
on:
  push:
    branches: [main]
concurrency:
  group: trenza-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TRƎNZA_WORKERS_READY
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip and rsync
        run: sudo apt-get update && sudo apt-get install -y unzip rsync
      - name: Replace old site with final motion package
        run: |
          set -euo pipefail
          ZIP="../TRƎNZA_GITHUB_READY_FINAL_MOTION_FIXED.zip"
          test -s "$ZIP"
          rm -rf /tmp/trenza-final
          mkdir -p /tmp/trenza-final
          unzip -q "$ZIP" -d /tmp/trenza-final
          SITE_DIR="$(dirname "$(find /tmp/trenza-final -type f -name index.html -print -quit)")"
          test -n "$SITE_DIR"
          test -s "$SITE_DIR/index.html"
          rm -rf public
          mkdir -p public
          rsync -a --delete --exclude='functions' "$SITE_DIR/" public/
          if [ -f "$SITE_DIR/functions/api/lead.js" ]; then
            mkdir -p functions/api
            cp "$SITE_DIR/functions/api/lead.js" functions/api/lead.js
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate final package
        run: |
          test -s public/index.html
          test -d public/assets
          test -s public/assets/products/eclat.jpg
          test -s public/assets/products/vita.jpg || test -s public/assets/products/vita-20260821.jpg
          test -s public/assets/motion/trenza-hero-loop.mp4
          test -s public/assets/motion/trenza-collection-loop.mp4
          test -s functions/api/lead.js
          node --check worker/index.js
          node --check functions/api/lead.js
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
