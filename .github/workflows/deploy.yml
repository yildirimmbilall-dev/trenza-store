name: Deploy TRENZA
on:
  push:
    branches: [main]
concurrency:
  group: trenza-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TRƎNZA_WORKERS_READY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Prepare and validate final site
        run: |
          node scripts/prepare-site.mjs
          test -s public/assets/products/vita-20260821.webp
          test -s public/assets/products/eclat.webp
          node --check worker/index.js
          node --check functions/api/lead.js
          grep -q "checkoutEndpoint:'/api/lead'" public/commerce-config.js
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}