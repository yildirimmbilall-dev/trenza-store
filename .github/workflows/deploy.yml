name: Deploy TRENZA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TRƎNZA_WORKERS_READY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare VITA asset
        run: |
          test -s public/assets/products/vita.jpg
          cp public/assets/products/vita.jpg public/assets/products/vita-20260821.jpg
          file public/assets/products/vita.jpg
          file public/assets/products/vita-20260821.jpg

      - name: Apply final site fixes
        run: node scripts/prepare-site.mjs

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
