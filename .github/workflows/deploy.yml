name: Deploy TRENZA
on:
  push:
    branches: [main]
concurrency:
  group: trenza-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TRƎNZA_WORKERS_READY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate production build
        run: |
          test -s public/index.html
          test -s public/assets/products/eclat.jpg
          test -s public/trenza-motion.css
          test -s public/trenza-motion.js
          grep -q 'trenzaGoldSweep' public/trenza-motion.css
          grep -q 'trenzaEditorialDrift' public/trenza-motion.css
          node --check worker/index.js
          node --check functions/api/lead.js
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
